onst open = Math.min(1, travel / doorH);\n    if (this.heroRef.current) { this.heroRef.current.style.opacity = Math.min(1, 0.35 + open * 0.9); this.heroRef.current.style.transform = `translateY(${((1 - open) * 30).toFixed(1)}px)`; }\n    if (this.spillRef.current) this.spillRef.current.style.opacity = open * 0.9;\n    if (this.sweepRef.current) this.sweepRef.current.style.opacity = 1 - open;\n    if (this.hintRef.current) this.hintRef.current.style.opacity = Math.max(0, 1 - p * 4);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n  }\n  icon(paths) {\n    return React.createElement('svg', { width: 26, height: 26, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true' },\n      ...paths.map((d, i) => React.createElement('path', { key: i, d })));\n  }\n  renderVals() {\n    const { wide, sent } = this.state;\n    const services = [\n      { title: 'Garage Door Repair', text: 'Doors that won\\u2019t open or close, stop halfway, grind or shake. Diagnosed and fixed on the spot.', icon: this.icon(['M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3l9.4-9.4z', 'M3 3l4 4']) },\n      { title: 'Spring Replacement', text: 'Snapped torsion or extension spring replaced with high-cycle springs, then rebalanced.', icon: this.icon(['M3 12h2', 'M19 12h2', 'M5 12c1.5-4 3.5-4 5 0s3.5 4 5 0 3.5-4 4 0']) },\n      { title: 'Opener Repair & Installation', text: 'All major brands. Quiet belt-drive openers with battery backup and smartphone control.', icon: this.icon(['M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M9 8h6', 'M12 12v5']) },\n      { title: 'Cable & Roller Repair', text: 'Frayed cables, a crooked door, screeching rollers — new cables and sealed nylon rollers.', icon: this.icon(['M4 4v16', 'M20 4v16', 'M7 8h10', 'M7 16h
